<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Admin Login - Janya Fashions</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #fff0f7, #ffe6f0, #fff);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  
  .login-container {
    background: white;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 400px;
  }
  
  h1 {
    color: #d63384;
    text-align: center;
    margin-bottom: 10px;
    font-size: 2em;
  }
  
  .subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 30px;
    font-size: 0.9em;
  }
  
  .form-group {
    margin-bottom: 20px;
  }
  
  label {
    display: block;
    margin-bottom: 8px;
    color: #555;
    font-weight: 600;
    font-size: 0.9em;
  }
  
  input[type="password"] {
    width: 100%;
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 6px;
    font-size: 1em;
    transition: border-color 0.3s;
  }
  
  input[type="password"]:focus {
    outline: none;
    border-color: #d63384;
  }
  
  .error-message {
    background: #f8d7da;
    color: #721c24;
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 20px;
    border: 1px solid #f5c6cb;
    font-size: 0.9em;
  }
  
  .login-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #d63384, #c2185b);
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 1.1em;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
  }
  
  .login-btn:hover {
    background: linear-gradient(135deg, #c2185b, #a0154a);
    transform: scale(1.02);
  }
  
  .login-btn:active {
    transform: scale(0.98);
  }
  
  .back-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #d63384;
    text-decoration: none;
    font-size: 0.9em;
  }
  
  .back-link:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="login-container">
    <h1>🔐 Admin Login</h1>
    <p class="subtitle">Janya Fashions Admin Panel</p>
    
    {% if error %}
    <div class="error-message">
      {{ error }}
    </div>
    {% endif %}
    
    <form method="POST" action="{{ url_for('admin_login') }}">
      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required autofocus>
      </div>
      
      <button type="submit" class="login-btn">Login</button>
    </form>
    
    <a href="{{ url_for('index') }}" class="back-link">← Back to Home</a>
  </div>
</body>
</html>
